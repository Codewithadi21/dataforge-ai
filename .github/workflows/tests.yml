name: DataForge validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Twenty-plus golden question checks
        run: python -m dataforge.cli eval --output eval/latest_results.json
      - name: Verify golden cases
        run: python -c "import json; r=json.load(open('eval/latest_results.json')); assert r['total'] >= 20 and r['passed']==r['total'], r"
