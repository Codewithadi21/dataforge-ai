[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge-ai-copilot"
version = "0.1.0"
description = "Evidence-grounded, read-only data engineering copilot"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.22,<1",
  "scikit-learn>=1.1,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.33,<2"]
qwen = ["transformers>=4.40,<5", "torch>=2.1"]
cloud = ["google-cloud-bigquery>=3.20,<5", "google-auth>=2.20,<3", "google-cloud-pubsub>=2.15,<3"]
pdf = ["pypdf>=4,<7"]
dev = ["pytest>=7,<10", "httpx>=0.24,<1"]

[project.scripts]
dataforge = "dataforge.cli:main"

[tool.setuptools.packages.find]
include = ["dataforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
